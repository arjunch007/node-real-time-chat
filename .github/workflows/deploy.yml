name: Auto Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Change to your main branch if different
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'  # Change to your Node version

      - name: Install dependencies
        run: npm install

      - name: Run tests (optional)
        run: npm test
        continue-on-error: true

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/node-real-time-chat
            git pull origin main
            npm install
            npm run build  # If you have a build step
            pm2 restart real-time-chat  # If using PM2, or use: systemctl restart your-service
            pm2 save
            # Or use: sudo systemctl restart your-app (if using systemd)
