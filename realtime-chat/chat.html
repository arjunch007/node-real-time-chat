        .profile-img {

        .badge-count {
            position: absolute;
            top: -8px;
            right: -8px;

            color: white;
            border-radius: 50%;
            min-width: 18px;
            height: 18px;

        .new-message-badge {

            }

            100% {

            }

    <script>
        function newMessageIndicator() {
            // Get the Open-tab button
            const openTab = document.getElementById('Open-tab');

            // Create a notification badge if it doesn't exist
            let badge = openTab.querySelector('.new-message-badge');
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'new-message-badge';
                openTab.style.position = 'relative';
                openTab.appendChild(badge);
            }

            // Add animation
            badge.style.animation = 'pulse 1s ease-in-out';

            // Remove animation after it completes
            setTimeout(() => {
                badge.style.animation = '';
            }, 1000);
        }
        // Clear the badge when switching to Open-tab
        document.getElementById('Open-tab').addEventListener('click', () => {
            const badge = document.querySelector('#Open-tab .new-message-badge');
            if (badge) {
                badge.remove();
            }
        });

        // Function to move sender to top of chat list when receiving a message
        function moveSenderToTop(senderId, latestMessage) {
            const existingUser = document.querySelector(`#chatUserList [data-user-id="${senderId}"]`);
            if (existingUser) {
                // Update last message
                const messagePreview = existingUser.querySelector('.flex-grow-1 p');
                if (messagePreview) {
                    messagePreview.textContent = latestMessage;
                }

                // Always move to top regardless of current position
                chatUserList.removeChild(existingUser);
                chatUserList.insertBefore(existingUser, chatUserList.firstChild);


                console.log('activeTab moveSenderToTop', activeTab.id);


                if (activeTab.id === 'Open-tab') {
                    // Scroll the moved user into view at the top
                    const sideBar = document.getElementById('side-bar');
                    sideBar.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                } else {
                    newMessageIndicator()
                }

                // Also move in the all users list
                const userInAllList = document.querySelector(`#userList [data-user-id="${senderId}"]`);
                if (userInAllList) {
                    userList.removeChild(userInAllList);
                    userList.insertBefore(userInAllList, userList.firstChild);
                }
            } else {
                if (activeTab.id === 'Open-tab') {
                    // If sender not in chat list, fetch their details and create new entry
                    fetch(`${apiUrl}/users/${senderId}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    }).then(response => {
                        handleUnauthorized(response);
                        return response.json();
                    }).then(response => {
                        const newChatUserListItem = createUserListItemHtml(response.data.user, true, latestMessage)
                        // Insert at the top of chat list
                        chatUserList.insertBefore(newChatUserListItem, chatUserList.firstChild);

                        updateUnreadCount(senderId, 1, 'unread');

                        // Scroll to top
                        const sideBar = document.getElementById('side-bar');
                        sideBar.scrollTo({
                            top: 0,
                            behavior: 'smooth'
                        });
                    }).catch(error => {
                        console.error("Error fetching user details:", error);
                    });
                } else {
                    newMessageIndicator()
                }
            }
        }

        /**
         * Updates the online status of a user in the UI.
         * @param {HTMLElement} element - The DOM element containing the online status indicator.
         * @param {string} userId - The ID of the user.
         */
        function updateOnlineStatus(element, userId) {
            if (!element || !userId) return;

            const isOnline = window.onlineUsers && window.onlineUsers.some(onlineUser => onlineUser.userId === userId);
            const statusSpan = element.querySelector('.online-status');

            if (statusSpan) {
                if (isOnline) {
                    statusSpan.classList.add('online');
                } else {
                    statusSpan.classList.remove('online');
                }
            }
        }

        function createUserListItemHtml(user, isChatUser = false, latestMessage = '') {
            const listItem = document.createElement("a");
            listItem.className = "d-flex align-items-center user-list-item";
            listItem.setAttribute('data-user-id', user._id || user.userId);

            const profileImg = "../assets/static-images/user-icon.png";
            const name = user.firstName + " " + user.lastName;
            const message = isChatUser ? user.latestMessage?.content || '' : '';
            const unreadCount = isChatUser && user.unreadCount > 0 ? `<span class="badge-count">${user.unreadCount}</span>` : '';

            listItem.innerHTML = `
                <div class="flex-shrink-0">
                    <img class="img-fluid profile-img" src="${profileImg}" alt="user img">
                    <span class="online-status"></span>
                    ${unreadCount}
                </div>
                <div class="flex-grow-1 ms-3">
                    <h3>${name}</h3>
                    <p>${message || latestMessage}</p>
                </div>
            `;

            // Add click handler with debounce
            listItem.addEventListener('click', debounce(() =>
                handleUserSelection(user.userId || user._id, user.firstName, user.lastName, listItem)
                , 300));

            updateOnlineStatus(listItem, user.userId || user._id);
            return listItem;
        }

        // Function to load ChatUsers
        function loadChatUsers(page, searchValue, eventType = '') {

            fetch(`${apiUrl}/messages/chat-users?page=${page}&search=${searchValue}`, {

                headers: {
                    'Authorization': `Bearer ${token}`,

                if (response) {
                    handleUnauthorized(response)
                }

                if (!response.ok) {

                }
                return response.json();
            }).then(usersResponse => {

                    chatUserList.innerHTML = ''

                        chatUserCurrentPage = 1;
                        hasMoreChatUsers = true;

                }

                if (usersResponse.data.users.length === 0) {

                usersResponse.data.users.forEach((user, index) => {
                    /* const chatUserListItem = document.createElement("a");

                    `;

                    if (window.onlineUsers && window.onlineUsers.some(ou => ou.userId === user.userId)) {
                        const statusSpan = chatUserListItem.querySelector('.online-status');
                        if (statusSpan) {

                    const chatUserListItem = createUserListItemHtml(user, true);

                    if (index === 0 && page === 1) {

                        document.getElementById("toUserName").textContent = toUserName

                    chatUserList.appendChild(chatUserListItem);

                let firstUnreadMessage = null;
                let lastReadMessage = null;

                const hasMessages = (usersResponse.data.message_data &&

                    usersResponse.data.message_data.messages) ? true : false;

                if (!hasMessages) {

                if (hasMessages && page === 1) {

                    usersResponse.data.message_data.messages.forEach(message => {

                        const messageClass = String(message.from_user_id._id) === String(user.id) ? 'reply' : 'sender';
                        if (!message.is_read && messageClass === 'sender' && !firstUnreadMessage) {

                        }

                        if (message.is_read && messageClass === 'sender') {
                            messageElement.classList.add('read');
                            lastReadMessage = messageElement;
                        }

                        lastMessageElement = messageElement;

                        chatList.appendChild(messageElement);

                    requestAnimationFrame(() => {

                            const messageTop = firstUnreadMessage.offsetTop;
                            const containerHeight = chatContainer.clientHeight;

                        } else if (lastMessageElement) {

                            const messageTop = lastMessageElement.offsetTop;
                            const containerHeight = chatContainer.clientHeight;
                            const scrollPosition = messageTop - (containerHeight / 2) + (lastMessageElement.offsetHeight / 2);

                            chatContainer.scrollTo({

                            });

        function scrollChatToBottom() {

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        // Utility functions
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Handle user selection
        function handleUserSelection(userId, firstName, lastName, clickedElement) {

            // Show loading state
            chatList.innerHTML = '<div class="loading">Loading messages...</div>';

            // Update state
            toUserId = userId;
            toUserName = `${firstName} ${lastName}`;

            // Update UI
            document.getElementById("toUserName").textContent = toUserName;

            // Remove active state from all users
            document.querySelectorAll('.chat-list a').forEach(item => {
                item.classList.remove('active-user');
            });

            // Add active state to selected user
            if (clickedElement) {
                clickedElement.classList.add('active-user');
            }

            chatList.innerHTML = '';

            // Load messages
            loadUserMessages(userId);

            // Clear typing indicator
            typingDiv.textContent = "";
        }

        function createQueryString(params) {
            const queryString = Object.keys(params)
                .map(key => `${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`)
                .join('&');
            return queryString ? `${queryString}` : '';
        }


        function loadMoreMessages(userId, lastMessageId) {

            const requestParams = {
                lastMessageId,
            };

            const loadMoreUrl = `${apiUrl}/messages/load-more/${userId}?${createQueryString(requestParams)}`;

            fetch(loadMoreUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            }).then(response => {
                handleUnauthorized(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            }).then(data => {


                if (data.data.messages.length > 0) {
                    data.data.messages.forEach(message => {
                        const messageElement = createMessageElement(
                            message,
                            message.from_user_id._id
                        )
                        chatList.appendChild(messageElement);
                    });
                }
                loadNewMessages = data.data.hasMore;
            }).catch(error => {
                console.error("Error loading messages:", error);
                chatList.innerHTML = `
                        <li class="error">
                            <p>Failed to load messages. Please try again.</p>
                        </li>
                    `;
            });
        }

        function loadMoreOldMessages(userId, firstMessageId) {
            const requestParams = {
                firstMessageId,
            };

            const loadMoreUrl = `${apiUrl}/messages/load-more-old/${userId}?${createQueryString(requestParams)}`;

            fetch(loadMoreUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            }).then(response => {
                handleUnauthorized(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            }).then(data => {
                if (data.data.messages.length > 0) {
                    data.data.messages.forEach(message => {
                        const messageElement = createMessageElement(
                            message,
                            message.from_user_id._id,
                            'old'
                        )
                        chatList.insertBefore(messageElement, chatList.firstElementChild);
                    });
                    chatContainer.scrollBy({
                        top: 50,
                        behavior: 'smooth' // This enables smooth scrolling
                    });
                }
                loadOldMessages = data.data.hasMore;

            }).catch(error => {
                console.error("Error loading messages:", error);
                chatList.innerHTML = `
                        <li class="error">
                            <p>Failed to load messages. Please try again.</p>
                        </li>
                    `;
            });

        }

        // Load messages for selected user and load more messages when scrolled to the bottom
        function loadUserMessages(userId, params = null) {

            // Construct the URL with query parameters
            const getMessagesUrl = `${apiUrl}/messages/${userId}`;
            fetch(getMessagesUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            }).then(response => {
                handleUnauthorized(response);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.json();
            }).then(data => {
                chatList.innerHTML = ''; // Clear only on first load

                if (data.data.message_data.messages.length > 0) {
                    data.data.message_data.messages.forEach(message => {
                        const messageElement = createMessageElement(
                            message,
                            message.from_user_id._id
                        )
                        chatList.appendChild(messageElement);
                    });

                    // Scroll to latest message
                    if (chatList.lastElementChild) {
                        chatList.lastElementChild.scrollIntoView({ behavior: 'smooth' });
                    }

                } else {
                    chatList.innerHTML = `
                        <li class="no-messages">
                            <p>No messages yet. Start a conversation!</p>
                        </li>
                    `;
                }
            }).catch(error => {
                console.error("Error loading messages:", error);
                chatList.innerHTML = `
                        <li class="error">
                            <p>Failed to load messages. Please try again.</p>
                        </li>
                    `;
            });
        }

        // Scroll handler for pagination
        const sideBar = document.getElementById('side-bar');
        sideBar.addEventListener('scroll', debounce(() => {

            if (sideBar.scrollTop + sideBar.clientHeight >= sideBar.scrollHeight) {
                if (activeTab.id === 'Open-tab') {
                    if (hasMoreChatUsers) {
                        chatUserCurrentPage++;
                        loadChatUsers(chatUserCurrentPage, searchUserString, 'scroll');
                    }
                } else {
                    if (hasMoreUsers) {
                        currentPage++;
                        loadUsers(currentPage, searchUserString, 'scroll');
                    }
                }
            }
        }, 200));

        // Add reconnection handling
        socket.on("connect_error", (error) => {
            console.log("Connection error:", error);
            // You might want to show a connection error message to the user
        });

        socket.on("reconnect", (attemptNumber) => {
            console.log("Reconnected after " + attemptNumber + " attempts");
            // Re-register user as online after reconnection
            socket.emit("online_user", {
                userId: user.id,
                username: username
            });
        });

        function getLastVisibleUnreadMessageId() {
            const messages = chatContainer.querySelectorAll('#chatList li.sender:not(.read)');
            let lastMessageId = null;

            messages.forEach(message => {
                const messageId = message.getAttribute('data-message-id');
                if (messageId) {
                    lastMessageId = messageId; // Update lastMessageId with the current messageId
                }
            });
            return lastMessageId;
        }

        // Enhanced function to get visible unread messages

        function markMessagesAsRead() {
            if (!toUserId) return;

            const lastMessageId = getLastVisibleUnreadMessageId();

            if (!lastMessageId) return;

            fetch(`${apiUrl}/messages/${toUserId}/read`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ lastMessageId })
            })
                .then(response => {
                    handleUnauthorized(response);
                    if (!response.ok) {
                        throw new Error("Failed to mark messages as read");
                    }
                    return response.json();
                })
                .then(data => {
                    // Mark messages as read in UI
                    data.updatedMessageIds.forEach(messageId => {
                        const messageElement = document.querySelector(`#chatList li[data-message-id="${messageId}"]`);
                        if (messageElement) {
                            messageElement.classList.add('read');
                        }
                    });

                    // Update badge count
                    updateUnreadCount(toUserId, data.updatedCount, 'read');

                    // Emit socket event to notify sender
                    socket.emit('messages_read', {
                        fromUserId: user.id,
                        toUserId: toUserId,
                        messageIds: data.updatedMessageIds
                    });
                })
                .catch(error => {
                    console.error("Error marking messages as read:", error);
                });
        }

        function updateUnreadCount(userId, count, countType) {
            const userElement = document.querySelector(`#chatUserList [data-user-id="${userId}"]`);
            if (userElement) {
                const badgeElement = userElement.querySelector('.badge-count');
                if (badgeElement) {
                    let newUnreadCount;
                    const unreadCount = parseInt(badgeElement.textContent);

                    if (countType === 'read') {
                        newUnreadCount = unreadCount - count;
                        badgeElement.textContent = newUnreadCount;
                    } else {
                        newUnreadCount = unreadCount + count;
                        badgeElement.textContent = newUnreadCount;
                    }

                    if (newUnreadCount === 0) {
                        badgeElement.remove();
                    }
                } else {

                    let unreadCountFromServer = 0;

                    fetch(`${apiUrl}/messages/unread-count/${userId}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    })
                        .then(response => {
                            handleUnauthorized(response);
                            if (!response.ok) {
                                throw new Error("Failed to get unread count");
                            }
                            return response.json();
                        })
                        .then(data => {
                            unreadCountFromServer = data.data.unreadCount;

                            const statusSpan = userElement.querySelector('.online-status');
                            if (statusSpan && unreadCountFromServer > 0) {
                                const badgeHtml = `<span class="badge-count">${unreadCountFromServer}</span>`;
                                statusSpan.insertAdjacentHTML('afterend', badgeHtml); // Insert after online-status
                            }
                        })
                        .catch(error => {
                            console.error("Error getting unread count:", error);
                        });
                }
            }
        }

        // Update read status when messages are read
        socket.on('messages_read_ack', (data) => {
            const { messageIds } = data;

            messageIds.forEach(messageId => {
                const messageElement = document.querySelector(`#chatList li[data-message-id="${messageId}"]`);
                if (messageElement) {
                    const readStatus = messageElement.querySelector('.read-status');
                    if (readStatus) {
                        readStatus.innerHTML = '<i class="fa fa-check-double"></i>';
                    }
                }
            });
        });

        // Modify the chat container scroll event listener
        let scrollTimeout;
        chatContainer.addEventListener('scroll', () => {

            // load new messages when scrolled to the bottom
            if (chatContainer.scrollTop + chatContainer.clientHeight >= chatContainer.scrollHeight) {
                if (loadNewMessages) {
                    const lastMessageElement = chatList.lastElementChild; // Get the last message element
                    const lastMessageId = lastMessageElement ? lastMessageElement.getAttribute('data-message-id') : null; // Get the data-message-id
                    if (lastMessageId) {
                        loadMoreMessages(toUserId, lastMessageId);
                    }
                }

                const lastMessageElement = chatList.lastElementChild; // Get the last message element again
                if (lastMessageElement) { // Check if lastMessageElement is not null
                    const lastMessageId = lastMessageElement.getAttribute('data-message-id');
                    // Check if user has scrolled to the bottom
                    clearTimeout(scrollTimeout);

                    scrollTimeout = setTimeout(() => {
                        const lastMessageId = getLastVisibleUnreadMessageId();
                        if (lastMessageId) {
                            markMessagesAsRead();
                        }
                    }, 100); // 100ms debounce
                }
            }

            // Check if user has scrolled to the top
            if (chatContainer.scrollTop === 0) {
                const firstMessageElement = chatList.firstElementChild; // Get the first message element
                const firstMessageId = firstMessageElement ? firstMessageElement.getAttribute('data-message-id') : null; // Get the data-message-id
                if (loadOldMessages && firstMessageId) {
                    loadMoreOldMessages(toUserId, firstMessageId); // Call the function to load old messages
                }
            }
        });

        // Add hover tracking for unread messages
        function setupMessageHoverTracking() {
            let hoverTimer;
            const HOVER_DELAY = 1000; // 1 second delay

            chatList.addEventListener('mouseover', (e) => {
                const messageElement = e.target.closest('li.sender:not(.read)');
                if (!messageElement) return;

                clearTimeout(hoverTimer);
                hoverTimer = setTimeout(() => {
                    const messageId = messageElement.getAttribute('data-message-id');
                    if (messageId) {
                        const lastMessageId = getLastVisibleUnreadMessageId();
                        if (lastMessageId === messageId) {
                            markMessagesAsRead();
                        }
                    }
                }, HOVER_DELAY);
            });

            chatList.addEventListener('mouseout', () => {
                clearTimeout(hoverTimer);
            });
        }

        setupMessageHoverTracking();

        // Add this helper function to create message elements
        function createMessageElement(message, fromUserId, messageType = null) {
            const chatListItems = document.createElement("li");
            chatListItems.setAttribute('data-message-id', message._id);

            // Determine if message is from current user
            const messageClass = String(fromUserId) === String(user.id) ? 'reply' : messageType === 'old' ? 'sender read' : 'sender';
            chatListItems.className = messageClass;

            // Add read status only for sent messages (reply)
            const readStatus = messageClass === 'reply' ?
                `<span class="read-status">
                ${message.is_read ?
                    '<i class="fa fa-check-double"></i>' :
                    '<i class="fa fa-check"></i>'}
                </span>` : '';

            chatListItems.innerHTML = `
                <p>${message.content}</p>
                <span class="time">${formatDate(message.createdAt)}</span>
                ${readStatus}
            `;

            return chatListItems;
        }

        const searchUser = document.getElementById('searchUser');

        searchUser.addEventListener('keyup', (e) => {
            const searchValue = e.target.value;
            // if (searchValue.length >= 3) {
            const activeTab = document.querySelector('#myTab .nav-link.active');

            if (activeTab.id === 'Open-tab') {
                loadChatUsers(1, searchValue, 'keyup');
            } else {
                loadUsers(1, searchValue, 'keyup');
            }

            // }
        });

        // Load header and footer components
        function loadComponent(id, file, callback) {
            fetch(file)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                    if (callback) callback();
                })
                .catch(error => console.error("Error loading " + file + ":", error));
        }

        // Load header and attach logout function after it's loaded
        loadComponent("header-placeholder", "header.html", function () {
            document.getElementById("logoutButton").addEventListener("click", function () {
                localStorage.removeItem("authToken");
                localStorage.removeItem("userData");
                window.location.href = "index.html"; // Redirect to login page
            });
        });

        // Load footer
        loadComponent("footer-placeholder", "footer.html");

        // Redirect to login if no auth token exists
        if (!localStorage.getItem("authToken")) {
            window.location.href = "index.html";
        }

    </script>
